baseURL: "https://mingyi-ai.github.io/"
title: "Mingyi's Page"
theme: "hugo-theme-stack"
defaultContentLanguage: "en"
locale: "en-US"

pagination:
  pagerSize: 10

enableInlineShortcodes: true
enableRobotsTXT: true
enableEmoji: true

build:
  drafts: false
  future: false
  expired: false

frontmatter:
  date: ["date", "publishDate"]
  lastmod: ["lastmod", "date", "publishDate"]
  publishDate: ["publishDate", "date"]
  expiryDate: ["expiryDate"]

minify:
  disableXML: true

outputs:
  home:
    - HTML
    - RSS

menu:
  main:
    - identifier: home
      name: Home
      pageRef: /
      weight: 10
      params:
        icon: home
  social:
    - identifier: github
      name: GitHub
      url: "https://github.com/mingyi-ai"
      params:
        icon: brand-github
        newTab: true
    - identifier: linkedin
      name: LinkedIn
      url: "https://www.linkedin.com/in/mingyi-h-b71b5219b/"
      params:
        icon: brand-linkedin
        newTab: true

params:
  mainSections: ["posts", "projects"]
  SortBy: "lastmod"
  rssFullContent: true
  author: "Mingyi Hou"
  description: "Mingyi Hou is a quantitative analyst and engineer with a PhD in Mathematics, working across probability, partial differential equations, and machine learning."
  keywords: ["Mingyi Hou", "quantitative analyst", "mathematics", "probability", "partial differential equations", "machine learning"]

  footer:
    since: 2025

  dateFormat:
    published: ":date_long"
    lastUpdated: ":date_long"

  sidebar:
    subtitle: "Machine Learning | Mathematics"
    avatar: "img/avatar.png"

  article:
    headingAnchor: true
    math: false
    toc: true
    readingTime: true
    list:
      showTags: true
    license:
      enabled: false

  widgets:
    homepage: []
    page:
      - type: toc

  opengraph:
    twitter:
      card: summary_large_image

  colorScheme:
    toggle: true
    default: auto

  imageProcessing:
    autoOrient: true
    external:
      timeout: "5s"
    content:
      enabled: true
      widths: [800, 1600, 2400]
    thumbnail:
      enabled: true

  comments:
    enabled: false

markup:
  highlight:
    codeFences: true
    lineNos: true
    noClasses: false
  goldmark:
    renderer:
      unsafe: true
    extensions:
      passthrough:
        delimiters:
          block: [["\\[", "\\]"], ["$$", "$$"]]
          inline: [["\\(", "\\)"], ["$", "$"]]
        enable: true
    parser:
      attribute:
        block: true
